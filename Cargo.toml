[package]
name = "damned"
version = "0.1.0"
edition = "2021"
description = "Compact Windows system monitor"
license = "MIT"
build = "build.rs"

[dependencies]
slint = { version = "~1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
slint-build = "~1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
